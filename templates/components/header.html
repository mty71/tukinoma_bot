<header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
  <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-brand-500/10 rounded-xl text-brand-500">
        <i data-lucide="bot" class="w-6 h-6"></i>
      </div>
      <h1 class="text-xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
        Tukinoma Bot Dashboard
      </h1>
    </div>

    <!-- ログイン状態の表示・制御 -->
    <div class="flex items-center gap-4">
      {% if is_authenticated %}
        <span class="text-xs text-slate-300 font-medium">👤 {{ username }}</span>
        <a href="/api/auth/logout" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-300">
          ログアウト
        </a>
      {% else %}
        <a href="/api/auth/login" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-brand-500 hover:bg-brand-600 text-white flex items-center gap-1.5">
          <i data-lucide="log-in" class="w-4 h-4"></i> Discordでログイン
        </a>
      {% endif %}
    </div>
  </div>
</header>
