<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tukinoma Bot Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#5865F2', 600: '#4752C4' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

  <!-- ヘッダーコンポーネント読み込み -->
  {% include "components/header.html" %}

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
    <!-- 各画面コンポーネント読み込み -->
    {% include "components/alarm_section.html" %}
    {% include "components/vc_section.html" %}
    {% include "components/clear_section.html" %}
  </main>

  <script>
    lucide.createIcons();

    function switchNav(type) {
      document.getElementById('sectionAlarm').classList.toggle('hidden', type !== 'alarm');
      document.getElementById('sectionVc').classList.toggle('hidden', type !== 'vc');
      document.getElementById('sectionClear').classList.toggle('hidden', type !== 'clear');

      document.getElementById('navAlarm').className = type === 'alarm' ? 'px-3 py-1.5 rounded-lg text-xs font-medium bg-brand-500 text-white flex items-center gap-1.5' : 'px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 flex items-center gap-1.5';
      document.getElementById('navVc').className = type === 'vc' ? 'px-3 py-1.5 rounded-lg text-xs font-medium bg-brand-500 text-white flex items-center gap-1.5' : 'px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 flex items-center gap-1.5';
      document.getElementById('navClear').className = type === 'clear' ? 'px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-600 text-white flex items-center gap-1.5' : 'px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 flex items-center gap-1.5';
    }

    function switchSourceTab(type) {
      document.getElementById('youtubeInputGroup').classList.toggle('hidden', type !== 'youtube');
      document.getElementById('fileInputGroup').classList.toggle('hidden', type !== 'file');
      document.getElementById('tabYoutube').className = type === 'youtube' ? 'px-3 py-1 rounded-lg text-xs bg-brand-500 text-white' : 'px-3 py-1 rounded-lg text-xs text-slate-400';
      document.getElementById('tabFile').className = type === 'file' ? 'px-3 py-1 rounded-lg text-xs bg-brand-500 text-white' : 'px-3 py-1 rounded-lg text-xs text-slate-400';
    }

    async function submitForm(e, url) {
      e.preventDefault();
      const res = await fetch(url, { method: 'POST', body: new FormData(e.target) });
      const data = await res.json();
      if (data.status === 'ok') { alert('✅ 保存しました！'); location.reload(); }
      else { alert('❌ エラーが発生しました'); }
    }

    async function deleteItem(url, guildId, targetId, keyName) {
      if (!confirm('本当に削除しますか？')) return;
      const form = new FormData();
      form.append('guild_id', guildId);
      form.append(keyName, targetId);
      const res = await fetch(url, { method: 'POST', body: form });
      const data = await res.json();
      if (data.status === 'ok') { location.reload(); }
    }

    async function submitClear(e) {
      e.preventDefault();
      if (!confirm('指定した件数のメッセージを削除します。よろしいですか？')) return;
      const res = await fetch('/api/clear', { method: 'POST', body: new FormData(e.target) });
      const data = await res.json();
      if (data.status === 'ok') { alert(`🧹 ${data.deleted_count}件のメッセージを削除しました！`); }
      else { alert(`❌ エラー: ${data.message}`); }
    }

    async function stopAlarm(guildId) {
      const form = new FormData();
      form.append('guild_id', guildId);
      const res = await fetch('/api/alarm/stop', { method: 'POST', body: form });
      const data = await res.json();
      if (data.status === 'ok') { alert('⏹️ アラームを停止しました！'); }
      else { alert('⚠️ 現在再生中のアラームはありません。'); }
    }
  </script>
</body>
</html>
